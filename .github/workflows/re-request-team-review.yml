name: Re-request Team Review

on:
  workflow_call:
    inputs:
      team-slug:
        description: "GitHub team slug to re-request"
        required: true
        type: string
      required-approvals:
        description: "Number of approvals required before stopping re-requests"
        required: false
        default: 2
        type: number

permissions: {}

jobs:
  re-request:
    name: Re-request team review
    if: >
      github.event.review.state == 'approved' &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.review.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TEAM_SLUG: ${{ inputs.team-slug }}
          REQUIRED_APPROVALS: ${{ inputs.required-approvals }}
        with:
          script: |
            const teamSlug = process.env.TEAM_SLUG;
            const required = Number(process.env.REQUIRED_APPROVALS);
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const [{ data: pr }, reviews] = await Promise.all([
              github.rest.pulls.get({ owner, repo, pull_number }),
              github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number }),
            ]);

            const latestByUser = new Map();
            for (const r of reviews) {
              latestByUser.set(r.user.login, r.state);
            }

            const approvals = [...latestByUser.values()].filter(s => s === 'APPROVED').length;
            const pendingUsers = pr.requested_reviewers?.length ?? 0;

            if (approvals + pendingUsers >= required) {
              return;
            }

            const alreadyRequested = pr.requested_teams?.some(
              t => t.slug.toLowerCase() === teamSlug.toLowerCase()
            );
            if (alreadyRequested) {
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner,
              repo,
              pull_number,
              team_reviewers: [teamSlug],
            });
